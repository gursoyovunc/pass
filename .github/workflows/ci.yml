name: CI - Quality Gate

on:
  pull_request:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write
      repository-projects: write

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore

      # Build + static analysis
      - name: Build & Analyze
        run: dotnet build -c Debug -warnaserror

      # Security code scan
      - name: Security Code Scan
        run: dotnet build -c Debug

      # Check vulnerable dependencies
      - name: Install GitHub CLI
        run: sudo apt install gh -y
      - name: Check vulnerable dependencies
        id: deps
        run: |
          #!/usr/bin/bash
          VULNS=$(dotnet list package --vulnerable | tail -n +2 | tr '\n' ' ')
          if echo "$VULNS" | grep -q -i "has the following vulnerable packages"; then
              echo "Vulnerabilities found:"
              echo "$VULNS"
              gh pr comment ${{ github.event.pull_request.number }} --body $':warning: Vulnerable dependencies detected\n\n$VULNS\n'
              exit 1
          else
              echo "No vulnerabilities found."
              exit 0
          fi
        env:
          DOTNET_ROOT: /usr/share/dotnet
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Unit Tests and Generate Coverage
        id: run-tests
        uses: alsi-lawr/dotnet-test-coverlet@v1
        with:
          project: 'tests/pass.tests'  # Specify the correct path to your test project directory
          exclude-files: '**/Migrations/*.cs'  # Example: Exclude migrations files
          threshold: 80  # Example: Set coverage threshold to 80%
          dotnet-version: '10.0'

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ${{ steps.run-tests.outputs.coverage-report-path }}  # Use the output from the previous step to upload the report

      # Comment coverage on PR
      - name: Comment coverage on PR
        uses: peter-evans/create-or-update-comment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Code Coverage Report
            Threshold: 80%
            Current coverage: ${{ steps.run-tests.outputs.coverage-report-path }}
